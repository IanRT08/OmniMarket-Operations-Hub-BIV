# OmniMarket Operations Hub — CI/CD
#
#   quality (lint + typecheck) → unit (Vitest) → e2e (Playwright + Postgres) → deploy (Vercel)
#
# El repositorio tiene la app en la subcarpeta omnimarket-hub/: GitHub solo lee
# workflows en la raíz (.github/workflows), así que este archivo vive aquí y
# todos los comandos corren dentro de omnimarket-hub/ (defaults.run).
#
# El despliegue a producción SOLO ocurre si los tres jobs anteriores pasan:
# omnimarket-hub/vercel.json desactiva el auto-deploy por Git, así que la
# única vía a producción es el job `deploy`. Si un test falla, no se despliega.
#
# Secretos de GitHub requeridos (Settings → Secrets and variables → Actions),
# solo para el job deploy: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# En Vercel, el proyecto debe tener Root Directory = omnimarket-hub.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la corrida anterior (salvo en main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24
  NEXT_TELEMETRY_DISABLED: 1

defaults:
  run:
    working-directory: omnimarket-hub

jobs:
  quality:
    name: Lint y typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: omnimarket-hub/package-lock.json
      - run: npm ci # postinstall: prisma generate (no necesita BD)
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Tests unitarios (Vitest)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: omnimarket-hub/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: Tests E2E (Playwright)
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omnimarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valores SOLO de prueba: la BD es efímera y el job nunca toca producción,
    # Google ni GitHub. La sesión E2E se simula con E2E_SESSION_TOKEN.
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omnimarket
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/omnimarket
      DB_POOL_MAX: 5
      ENABLE_TEST_ENDPOINTS: "true"
      AUDIT_TOKEN: ci-audit-token-only-for-tests
      E2E_SESSION_TOKEN: ci-e2e-session-token-only-for-tests
      BETTER_AUTH_SECRET: ci-better-auth-secret-only-for-tests-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-unused
      GOOGLE_CLIENT_SECRET: ci-unused
      GITHUB_CLIENT_ID: ci-unused
      GITHUB_CLIENT_SECRET: ci-unused

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: omnimarket-hub/package-lock.json
      - run: npm ci

      - name: Migraciones (incluye COLLATE "C" y CHECKs)
        run: npx prisma migrate deploy

      # Los navegadores pesan ~150 MB: se cachean por versión de Playwright.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache de navegadores
        id: browsers-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Instalar Chromium
        if: steps.browsers-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias del sistema (con navegador cacheado)
        if: steps.browsers-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts levanta `npm run build && npm run start` y el
      # proyecto `setup` siembra el dataset vía POST /api/test/reset-data.
      - name: Playwright
        run: npx playwright test

      - name: Reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            omnimarket-hub/playwright-report/
            omnimarket-hub/test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Desplegar a producción (Vercel)
    needs: e2e
    # push a main, o "Run workflow" manual sobre main (p. ej. tras cambiar
    # variables en Vercel: un deploy prebuilt no se puede redesplegar desde
    # su panel, hay que crear uno nuevo). Siempre después de pasar las pruebas.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # La URL del despliegue aparece como "View deployment" en GitHub.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    # La CLI de Vercel corre desde la raíz del repo: con Root Directory =
    # omnimarket-hub en el proyecto, `vercel build` compila esa subcarpeta.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Verificar secretos de Vercel
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos de GitHub:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global vercel@65.2.0
      # Trae la configuración (incluido Root Directory) y las variables de Production.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado en: $url"
          echo "### Desplegado en producción: $url" >> "$GITHUB_STEP_SUMMARY"
